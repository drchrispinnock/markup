# Markup Go, the iOS app. Generate MarkupGo.xcodeproj with `xcodegen`
# (run in this folder) after changing this file or adding source files.
name: MarkupGo
options:
  bundleIdPrefix: com.chrispinnock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Markup:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: CP8YGC8C4P
    CODE_SIGN_STYLE: Automatic
targets:
  MarkupGo:
    type: application
    platform: iOS
    sources:
      - MarkupGo
    dependencies:
      - package: Markup
        product: MarkupCore
    settings:
      base:
        PRODUCT_NAME: MarkupGo
        PRODUCT_BUNDLE_IDENTIFIER: com.chrispinnock.MarkupGo
        INFOPLIST_FILE: MarkupGo/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MarkupGoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MarkupGoTests
    dependencies:
      - target: MarkupGo
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chrispinnock.MarkupGoTests
schemes:
  MarkupGo:
    build:
      targets:
        MarkupGo: all
        MarkupGoTests: [test]
    test:
      targets:
        - MarkupGoTests
